name: Formatting

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@12.0.2 --registry=https://registry.npmjs.org
      - run: test "$(npm --version)" = "12.0.2"
      # Permit only the exact Git dependencies declared at the project root.
      - run: npm ci --ignore-scripts --allow-git=root
      - name: Check affected formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          start=$SECONDS
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            mapfile -d '' files < <(git diff --name-only -z --diff-filter=ACMRT "$BASE_SHA...$HEAD_SHA" -- '*.css' '*.html' '*.json' '*.jsonc' '*.md' '*.mjs' '*.ts' '*.tsx' '*.yaml' '*.yml')
            if (( ${#files[@]} )); then
              npx dprint check --allow-no-files -- "${files[@]}"
            fi
          else
            npm run format:check
          fi
          elapsed=$((SECONDS - start))
          echo "Affected formatting gate: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"
