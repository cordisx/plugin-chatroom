name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --diff-filter=ACMRT "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          docs_only=true
          full=false
          while IFS= read -r file; do
            case "$file" in
              *.md|*.markdown) ;;
              *) docs_only=false ;;
            esac
            case "$file" in
              AGENTS.md|.agents/*|package.json|package-lock.json|cordisx-package.json|runtime-manifest.json|tsconfig.json|vite.config.mjs|.github/*|scripts/*|entities/*)
                full=true
                ;;
            esac
          done < "$RUNNER_TEMP/changed-files"
          test -s "$RUNNER_TEMP/changed-files" || full=true
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          {
            echo '### Chatroom pull-request scope'
            echo
            echo "- base: \`$BASE_SHA\`"
            echo "- head: \`$HEAD_SHA\`"
            echo "- docs-only: \`$docs_only\`"
            echo "- full gate: \`$full\`"
          } >> "$GITHUB_STEP_SUMMARY"

  check:
    if: always() && (github.event_name == 'push' || needs.scope.outputs.full == 'true')
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: clock
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --allow-git=all
      - name: Run the complete owner gate
        run: npm run check
      - name: Record job evidence
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CLASSIFICATION: ${{ github.event_name == 'pull_request' && 'full' || 'main' }}
          STARTED_AT: ${{ steps.clock.outputs.started_at }}
          STARTED_EPOCH: ${{ steps.clock.outputs.started_epoch }}
          CACHE_HIT: ${{ steps.node.outputs.cache-hit }}
          RESULT: ${{ job.status }}
        run: |
          mkdir -p .ci-results
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          duration=$(($(date +%s) - STARTED_EPOCH))
          cache=$([[ "$CACHE_HIT" == 'true' ]] && echo hit || echo miss)
          evidence="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg schema 'cordisx/ci-job-result/v1' --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg gateVersion 'chatroom-check-v2' \
            --arg classification "$CLASSIFICATION" --arg job "$GITHUB_JOB" --arg startedAt "$STARTED_AT" \
            --arg completedAt "$completed_at" --arg cache "$cache" --arg result "$RESULT" \
            --arg environment 'github-hosted/ubuntu-latest/node22' \
            --arg evidenceUrl "$evidence" --argjson durationSeconds "$duration" \
            '{schema:$schema,repo:$repo,head:$head,base:$base,gateVersion:$gateVersion,classification:$classification,job:$job,environment:$environment,startedAt:$startedAt,completedAt:$completedAt,durationSeconds:$durationSeconds,cache:$cache,result:$result,evidenceUrl:$evidenceUrl}' \
            > .ci-results/check.json
          echo '### CI job result' >> "$GITHUB_STEP_SUMMARY"
          jq -c . .ci-results/check.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-result-${{ github.run_id }}-${{ github.job }}
          path: .ci-results/check.json
          if-no-files-found: warn

  typecheck:
    if: github.event_name == 'pull_request' && needs.scope.outputs.full != 'true' && needs.scope.outputs.docs_only != 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: clock
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --allow-git=all
      - name: Typecheck the plugin
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm run typecheck
      - name: Record job evidence
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STARTED_AT: ${{ steps.clock.outputs.started_at }}
          STARTED_EPOCH: ${{ steps.clock.outputs.started_epoch }}
          CACHE_HIT: ${{ steps.node.outputs.cache-hit }}
          RESULT: ${{ job.status }}
        run: |
          mkdir -p .ci-results
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          duration=$(($(date +%s) - STARTED_EPOCH))
          cache=$([[ "$CACHE_HIT" == 'true' ]] && echo hit || echo miss)
          evidence="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg schema 'cordisx/ci-job-result/v1' --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg gateVersion 'chatroom-check-v2' \
            --arg classification 'changed-typecheck' --arg job "$GITHUB_JOB" --arg startedAt "$STARTED_AT" \
            --arg completedAt "$completed_at" --arg cache "$cache" --arg result "$RESULT" \
            --arg environment 'github-hosted/ubuntu-latest/node22' \
            --arg evidenceUrl "$evidence" --argjson durationSeconds "$duration" \
            '{schema:$schema,repo:$repo,head:$head,base:$base,gateVersion:$gateVersion,classification:$classification,job:$job,environment:$environment,startedAt:$startedAt,completedAt:$completedAt,durationSeconds:$durationSeconds,cache:$cache,result:$result,evidenceUrl:$evidenceUrl}' \
            > .ci-results/typecheck.json
          echo '### CI job result' >> "$GITHUB_STEP_SUMMARY"
          jq -c . .ci-results/typecheck.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-result-${{ github.run_id }}-${{ github.job }}
          path: .ci-results/typecheck.json
          if-no-files-found: warn

  build-test:
    if: github.event_name == 'pull_request' && needs.scope.outputs.full != 'true' && needs.scope.outputs.docs_only != 'true'
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: clock
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "started_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - id: node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --allow-git=all
      - name: Build, then run tests against the build
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm run build
          npm test
      - name: Record job evidence
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STARTED_AT: ${{ steps.clock.outputs.started_at }}
          STARTED_EPOCH: ${{ steps.clock.outputs.started_epoch }}
          CACHE_HIT: ${{ steps.node.outputs.cache-hit }}
          RESULT: ${{ job.status }}
        run: |
          mkdir -p .ci-results
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          duration=$(($(date +%s) - STARTED_EPOCH))
          cache=$([[ "$CACHE_HIT" == 'true' ]] && echo hit || echo miss)
          evidence="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          jq -n --arg schema 'cordisx/ci-job-result/v1' --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg gateVersion 'chatroom-check-v2' \
            --arg classification 'build-test' --arg job "$GITHUB_JOB" --arg startedAt "$STARTED_AT" \
            --arg completedAt "$completed_at" --arg cache "$cache" --arg result "$RESULT" \
            --arg environment 'github-hosted/ubuntu-latest/node22' \
            --arg evidenceUrl "$evidence" --argjson durationSeconds "$duration" \
            '{schema:$schema,repo:$repo,head:$head,base:$base,gateVersion:$gateVersion,classification:$classification,job:$job,environment:$environment,startedAt:$startedAt,completedAt:$completedAt,durationSeconds:$durationSeconds,cache:$cache,result:$result,evidenceUrl:$evidenceUrl}' \
            > .ci-results/build-test.json
          echo '### CI job result' >> "$GITHUB_STEP_SUMMARY"
          jq -c . .ci-results/build-test.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-result-${{ github.run_id }}-${{ github.job }}
          path: .ci-results/build-test.json
          if-no-files-found: warn
